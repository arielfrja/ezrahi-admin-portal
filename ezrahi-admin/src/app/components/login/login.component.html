<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>ניהול Ezrahi</mat-card-title>
      <mat-card-subtitle>כניסת מנהלים (סופר-אדמין / מנהל ארגון)</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (errorMessage()) {
        <div class="error-banner">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>דוא״ל</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email" placeholder="admin@ezrahi.app" />
          <mat-error>כתובת דוא״ל לא תקינה</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>סיסמה</mat-label>
          <input matInput formControlName="password" type="password" autocomplete="current-password" />
          <mat-error>הסיסמה חייבת להכיל 6 תווים לפחות</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width submit-btn" [disabled]="isSubmitting() || loginForm.invalid">
          @if (isSubmitting()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            התחברות
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
