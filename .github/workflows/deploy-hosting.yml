name: Deploy Hosting

on:
  push:
    branches:
      - master

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ezrahi-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ezrahi-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx -y firebase-tools@15 deploy --only hosting:ezrahi-admin-portal --project ezrahi --non-interactive --token ${{ secrets.FIREBASE_TOKEN }}
